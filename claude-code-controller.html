<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🤖 Claude Code Controller v2 — Agent đa file</title>
<style>
:root{
  --bg:#0a0714; --panel:#17102e; --panel-2:#1f1740; --border:#3d2a6b; --border-soft:#2b1e53;
  --text:#f4eefe; --muted:#ab9cd4; --accent:#a855f7; --accent-2:#e879f9; --accent-3:#7c3aed;
  --green:#34e0a1; --red:#fb7185; --blue:#38bdf8; --gold:#fbbf24;
}
*{box-sizing:border-box;}
body{margin:0;color:var(--text);background:radial-gradient(1200px 620px at 10% -12%,rgba(168,85,247,.35),transparent 62%),var(--bg);
  font-family:'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;min-height:100vh;}
code,.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border-soft);
  background:rgba(23,16,46,.9);position:sticky;top:0;z-index:20;flex-wrap:wrap;gap:8px;}
header h1{font-size:17px;margin:0;font-weight:800;}
header .actions{display:flex;gap:8px;}
button{background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:9px;
  cursor:pointer;font:inherit;font-weight:600;font-size:12.5px;transition:.15s;}
button:hover{border-color:var(--accent);color:var(--accent-2);}
button:disabled{opacity:.45;cursor:not-allowed;}
button.primary{background:linear-gradient(135deg,var(--accent-2),var(--accent) 65%,var(--accent-3));color:#fff;border-color:transparent;}
button.danger{color:var(--red);border-color:rgba(251,113,133,.4);}
main{flex:1;max-width:920px;width:100%;margin:0 auto;padding:20px 16px 140px;}
#settings{display:none;background:var(--panel);border:1px solid var(--border-soft);border-radius:14px;padding:16px;margin-bottom:16px;}
#settings.show{display:block;}
#settings label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;font-weight:600;}
#settings input,#settings select{width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);
  padding:9px 10px;border-radius:8px;font:inherit;font-size:13px;}
#settings .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
#settings .hint{font-size:11.5px;color:var(--muted);margin-top:4px;}
#log{display:flex;flex-direction:column;gap:9px;font-size:13.5px;line-height:1.55;}
#log .line{padding:10px 13px;border-radius:12px;white-space:pre-wrap;word-break:break-word;}
#log .l-user{color:#fff;background:linear-gradient(135deg,var(--accent-2),var(--accent) 60%,var(--accent-3));align-self:flex-end;max-width:88%;font-weight:500;}
#log .l-info{color:var(--muted);background:var(--panel);border:1px solid var(--border-soft);font-size:12.5px;}
#log .l-tool{color:var(--blue);background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.25);font-size:12px;font-family:'JetBrains Mono',monospace;}
#log .l-ai{color:var(--text);background:var(--panel);border:1px solid var(--border-soft);}
#log .l-error{color:var(--red);background:rgba(251,113,133,.1);border:1px solid rgba(251,113,133,.28);font-weight:600;}
#log .l-success{color:var(--green);background:rgba(52,224,161,.1);border:1px solid rgba(52,224,161,.25);font-weight:600;}
#todoBox{background:var(--panel);border:1px solid var(--border-soft);border-radius:12px;padding:10px 14px;margin:6px 0;font-size:12.5px;}
#todoBox ul{margin:6px 0 0;padding-left:18px;}
#todoBox li.done{color:var(--green);text-decoration:line-through;}
#todoBox li.doing{color:var(--gold);}
#pending{display:none;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;margin-top:10px;}
#pending.show{display:block;}
#pending .file{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:1px solid var(--border-soft);font-size:12.5px;}
#pending .file:last-child{border-bottom:none;}
#pending .tag{font-size:10.5px;padding:2px 7px;border-radius:6px;font-weight:700;}
#pending .tag.new{background:rgba(52,224,161,.15);color:var(--green);}
#pending .tag.mod{background:rgba(56,189,248,.15);color:var(--blue);}
form#cmdForm{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(180deg,rgba(10,7,20,0),rgba(10,7,20,.96) 30%);
  padding:16px;display:flex;justify-content:center;}
form#cmdForm .inner{max-width:920px;width:100%;display:flex;gap:8px;background:var(--panel);border:1px solid var(--border);
  border-radius:14px;padding:10px;}
#cmdInput{flex:1;background:transparent;border:none;color:var(--text);font:inherit;font-size:14px;resize:none;outline:none;padding:8px;min-height:24px;max-height:160px;}
</style>
</head>
<body>
<header>
  <h1>🤖 Claude Code Controller v2 — Agent đa file</h1>
  <div class="actions">
    <button id="settingsBtn">⚙️ Cấu hình</button>
    <button id="stopBtn" disabled>⏹ Dừng</button>
  </div>
</header>
<main>
  <div id="settings">
    <div class="row">
      <div>
        <label>Chế độ AI</label>
        <select id="s_mode">
          <option value="api">Anthropic API (khoá riêng)</option>
          <option value="fcc">Free Claude Code — proxy trên máy tôi</option>
        </select>
      </div>
      <div>
        <label>Model</label>
        <input id="s_model" placeholder="claude-sonnet-5">
      </div>
    </div>
    <div id="apiFields">
      <label>Anthropic API Key</label>
      <input id="s_key" type="password" placeholder="sk-ant-...">
    </div>
    <div id="fccFields" style="display:none">
      <div class="row">
        <div><label>FCC URL</label><input id="s_fcc_url" placeholder="http://localhost:8082"></div>
        <div><label>FCC Token</label><input id="s_fcc_token" type="password"></div>
      </div>
    </div>
    <hr style="border-color:var(--border-soft);margin:14px 0;">
    <div class="row">
      <div><label>GitHub owner</label><input id="s_owner" placeholder="lammm2k5"></div>
      <div><label>GitHub repo</label><input id="s_repo" placeholder="test-y-hoc-tbump"></div>
    </div>
    <div class="row">
      <div><label>Branch</label><input id="s_branch" placeholder="main"></div>
      <div><label>GitHub PAT (cần để push)</label><input id="s_token" type="password" placeholder="ghp_..."></div>
    </div>
    <p class="hint">PAT cần quyền "repo" (hoặc "contents: write" nếu là fine-grained token). Mọi thông tin chỉ lưu trong localStorage trên máy bạn, không gửi đi đâu khác ngoài GitHub/Anthropic/FCC.</p>
    <button id="saveSettingsBtn" class="primary" style="margin-top:10px;">Lưu cấu hình</button>
  </div>

  <div id="log"></div>
  <div id="todoBox" style="display:none"></div>
  <div id="pending">
    <div style="font-weight:700;margin-bottom:8px;">📝 Thay đổi đang chờ (chưa push):</div>
    <div id="pendingList"></div>
    <div style="display:flex;gap:8px;margin-top:12px;">
      <button id="pushBtn" class="primary">🚀 Xác nhận &amp; Push lên GitHub</button>
      <button id="discardBtn" class="danger">Huỷ thay đổi</button>
    </div>
  </div>
</main>
<form id="cmdForm">
  <div class="inner">
    <textarea id="cmdInput" placeholder="Ra lệnh cho agent, vd: 'Thêm mục FAQ vào cuối trang, đọc data.json để lấy style hiện có'" rows="1"></textarea>
    <button id="sendBtn" class="primary" type="submit">Gửi</button>
  </div>
</form>

<script>
const LS_KEY = 'ccc_v2_settings';
let settings = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
let aborter = null;
let state = {
  tree: null,          // [{path,type,sha,size}]
  files: new Map(),    // path -> {original, current, sha, isNew}
  todos: [],
  messages: []         // conversation history sent to the model (persists across turns in this session)
};

// ---------------- settings UI ----------------
const $ = id => document.getElementById(id);
function refreshModeFields(){
  const isFcc = $('s_mode').value === 'fcc';
  $('apiFields').style.display = isFcc ? 'none' : 'block';
  $('fccFields').style.display = isFcc ? 'block' : 'none';
}
$('s_mode').addEventListener('change', refreshModeFields);
$('settingsBtn').addEventListener('click', ()=> $('settings').classList.toggle('show'));
function loadSettingsUI(){
  $('s_mode').value = settings.mode || 'api';
  $('s_model').value = settings.model || 'claude-sonnet-5';
  $('s_key').value = settings.anthropicKey || '';
  $('s_fcc_url').value = settings.fccUrl || 'http://localhost:8082';
  $('s_fcc_token').value = settings.fccToken || '';
  $('s_owner').value = settings.owner || '';
  $('s_repo').value = settings.repo || '';
  $('s_branch').value = settings.branch || 'main';
  $('s_token').value = settings.ghToken || '';
  refreshModeFields();
}
$('saveSettingsBtn').addEventListener('click', ()=>{
  settings = {
    mode: $('s_mode').value, model: $('s_model').value.trim() || 'claude-sonnet-5',
    anthropicKey: $('s_key').value.trim(), fccUrl: $('s_fcc_url').value.trim(), fccToken: $('s_fcc_token').value.trim(),
    owner: $('s_owner').value.trim(), repo: $('s_repo').value.trim(), branch: $('s_branch').value.trim() || 'main',
    ghToken: $('s_token').value.trim()
  };
  localStorage.setItem(LS_KEY, JSON.stringify(settings));
  $('settings').classList.remove('show');
  log('Đã lưu cấu hình.', 'l-success');
});
loadSettingsUI();
if(!settings.owner) $('settings').classList.add('show');

// ---------------- logging ----------------
function log(text, cls){
  const d = document.createElement('div');
  d.className = 'line ' + (cls || 'l-info');
  d.textContent = text;
  $('log').appendChild(d);
  window.scrollTo(0, document.body.scrollHeight);
  return d;
}
function renderTodos(){
  const box = $('todoBox');
  if(!state.todos.length){ box.style.display='none'; return; }
  box.style.display='block';
  box.innerHTML = '<b>📋 Kế hoạch:</b><ul>' + state.todos.map(t=>{
    const c = t.status==='completed'?'done':(t.status==='in_progress'?'doing':'');
    return '<li class="'+c+'">' + escapeHtml(t.content) + '</li>';
  }).join('') + '</ul>';
}
function escapeHtml(s){ return (s||'').replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// ---------------- GitHub helpers ----------------
function ghHeaders(){
  const h = { 'Accept': 'application/vnd.github+json' };
  if(settings.ghToken) h['Authorization'] = 'Bearer ' + settings.ghToken;
  return h;
}
function ghApi(path){ return 'https://api.github.com/repos/' + settings.owner + '/' + settings.repo + path; }
function b64ToUtf8(b64){
  const bin = atob(b64.replace(/\n/g,''));
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
function utf8ToB64(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for(let i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
async function ghGetJson(path){
  const r = await fetch(ghApi(path), { headers: ghHeaders() });
  if(!r.ok) throw new Error('GitHub API lỗi (' + r.status + ') tại ' + path + ': ' + (await r.text()).slice(0,200));
  return r.json();
}
async function loadTree(){
  const ref = await ghGetJson('/git/ref/heads/' + settings.branch);
  const commitSha = ref.object.sha;
  const commit = await ghGetJson('/git/commits/' + commitSha);
  const tree = await ghGetJson('/git/trees/' + commit.tree.sha + '?recursive=1');
  state.tree = tree.tree.filter(t => t.type === 'blob');
  state.baseCommitSha = commitSha;
  return state.tree;
}
const BINARY_EXT = /\.(png|jpe?g|gif|webp|ico|zip|pdf|mp4|mp3|woff2?|ttf|eot)$/i;
async function fetchFileText(path){
  if(state.files.has(path)) return state.files.get(path).current;
  const entry = state.tree.find(t=>t.path===path);
  if(!entry) throw new Error('Không tìm thấy file "' + path + '" trong repo.');
  if(BINARY_EXT.test(path)) throw new Error('File "' + path + '" là file nhị phân (ảnh/font/...), không đọc được dạng text.');
  const blob = await ghGetJson('/git/blobs/' + entry.sha);
  const text = b64ToUtf8(blob.content);
  state.files.set(path, { original: text, current: text, sha: entry.sha, isNew: false });
  return text;
}

// ---------------- tool implementations ----------------
async function toolListFiles(){
  if(!state.tree) await loadTree();
  return state.tree.map(t => t.path + ' (' + t.size + ' bytes)').join('\n');
}
async function toolReadFile(input){
  if(!state.tree) await loadTree();
  const text = await fetchFileText(input.path);
  const lines = text.split('\n');
  let s = input.start_line ? Math.max(1, input.start_line) : 1;
  let e = input.end_line ? Math.min(lines.length, input.end_line) : lines.length;
  const MAXLINES = 800;
  if(e - s + 1 > MAXLINES) e = s + MAXLINES - 1;
  const slice = lines.slice(s-1, e).map((l,i)=> (s+i) + '\t' + l).join('\n');
  return 'Tổng ' + lines.length + ' dòng. Hiển thị dòng ' + s + '-' + e + ':\n' + slice;
}
async function toolGrep(input){
  if(!state.tree) await loadTree();
  let re;
  try{ re = new RegExp(input.pattern, 'i'); } catch(e){ return 'Regex không hợp lệ: ' + e.message; }
  const targets = input.path ? [input.path] : state.tree.filter(t=>!BINARY_EXT.test(t.path)).map(t=>t.path);
  const max = input.max_matches || 60;
  let out = [], scanned = 0, budget = 15 * 1024 * 1024;
  for(const p of targets){
    if(out.length >= max || budget <= 0) break;
    let text;
    try{ text = await fetchFileText(p); } catch(e){ continue; }
    budget -= text.length;
    const lines = text.split('\n');
    for(let i=0;i<lines.length;i++){
      if(re.test(lines[i])){
        out.push(p + ':' + (i+1) + ':  ' + lines[i].trim().slice(0,200));
        if(out.length >= max) break;
      }
    }
    scanned++;
  }
  if(!out.length) return 'Không tìm thấy kết quả khớp với "' + input.pattern + '" (đã quét ' + scanned + ' file).';
  return out.join('\n') + (out.length>=max ? '\n...(đã cắt bớt, thu hẹp pattern hoặc chỉ định path để xem thêm)' : '');
}
async function toolEditFile(input){
  if(!state.files.has(input.path)) await fetchFileText(input.path);
  const f = state.files.get(input.path);
  const count = f.current.split(input.old_str).length - 1;
  if(count === 0) return 'LỖI: không tìm thấy old_str trong file "' + input.path + '". Hãy đọc lại file để lấy đúng đoạn text hiện tại.';
  if(count > 1) return 'LỖI: old_str khớp ' + count + ' lần trong "' + input.path + '" (phải khớp DUY NHẤT 1 lần). Hãy thêm ngữ cảnh xung quanh để old_str là duy nhất.';
  f.current = f.current.split(input.old_str).join(input.new_str);
  return 'Đã sửa "' + input.path + '" thành công (1 chỗ).';
}
async function toolWriteFile(input){
  const existing = state.tree && state.tree.find(t=>t.path===input.path);
  if(!state.files.has(input.path)){
    state.files.set(input.path, { original: existing ? null : null, current: input.content, sha: existing ? existing.sha : null, isNew: !existing });
  } else {
    state.files.get(input.path).current = input.content;
  }
  return 'Đã ghi toàn bộ nội dung file "' + input.path + '" (' + input.content.length + ' ký tự).';
}
async function toolTodoWrite(input){
  state.todos = input.todos || [];
  renderTodos();
  return 'Đã cập nhật kế hoạch (' + state.todos.length + ' việc).';
}
async function toolWebFetch(input){
  let r;
  try{ r = await fetch(input.url); }
  catch(e){ return 'LỖI: không tải được URL (rất có thể do trang không cho phép CORS từ trình duyệt — đây là giới hạn của trình duyệt, không sửa được). Chi tiết: ' + e.message; }
  if(!r.ok) return 'LỖI HTTP ' + r.status + ' khi tải ' + input.url;
  const raw = await r.text();
  const text = raw.replace(/<script[\s\S]*?<\/script>/gi,' ').replace(/<style[\s\S]*?<\/style>/gi,' ')
    .replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
  return text.slice(0, 6000) || '(trang không có nội dung text đọc được)';
}
// "Task" — subagent: chạy 1 vòng lặp agent con độc lập (không dùng chung lịch sử hội thoại
// với agent chính), để đào sâu/khám phá 1 việc cụ thể mà không làm phình context của agent chính.
// Mô phỏng đúng cơ chế "Task tool" của Claude Code thật.
async function toolTask(input){
  log('🧩 Subagent bắt đầu: ' + (input.description||''), 'l-tool');
  const subTools = TOOLS.filter(t => t.name !== 'task');
  const subSystem = 'Bạn là 1 subagent chuyên biệt được agent chính giao 1 việc CỤ THỂ, KHÉP KÍN. ' +
    'Dùng tool để hoàn thành đúng việc được giao, rồi trả lời bằng 1 đoạn TÓM TẮT kết quả súc tích (không tool call) để kết thúc — agent chính chỉ nhìn thấy đúng đoạn tóm tắt này, không thấy các bước chi tiết.';
  let messages = [{ role:'user', content: input.prompt }];
  for(let i=0;i<8;i++){
    let data;
    try{ data = await callModel(messages, aborter ? aborter.signal : undefined, { tools: subTools, system: subSystem }); }
    catch(e){ return 'LỖI subagent: ' + e.message; }
    const content = data.content || [];
    const text = content.filter(b=>b.type==='text').map(b=>b.text).join('\n').trim();
    const toolCalls = content.filter(b=>b.type==='tool_use');
    messages.push({ role:'assistant', content });
    if(!toolCalls.length){ log('🧩 Subagent xong: ' + text.slice(0,200), 'l-tool'); return text || '(subagent không trả về nội dung gì)'; }
    const resultBlocks = [];
    for(const tc of toolCalls){
      const r = await executeTool(tc.name, tc.input);
      resultBlocks.push({ type:'tool_result', tool_use_id: tc.id, content: String(r) });
    }
    messages.push({ role:'user', content: resultBlocks });
  }
  return '(subagent đạt giới hạn 8 bước, dừng lại)';
}
async function loadClaudeMd(){
  if(state.claudeMdTried) return;
  state.claudeMdTried = true;
  try{
    if(!state.tree) await loadTree();
    if(state.tree.find(t=>t.path==='CLAUDE.md')) state.claudeMd = await fetchFileText('CLAUDE.md');
  }catch(e){ /* không có CLAUDE.md — bỏ qua */ }
}

const TOOLS = [
  { name:'list_files', description:'Liệt kê toàn bộ đường dẫn file trong repo. Luôn gọi cái này đầu tiên nếu chưa biết cấu trúc repo.',
    input_schema:{type:'object', properties:{}, required:[]} },
  { name:'read_file', description:'Đọc nội dung 1 file. Với file lớn, dùng start_line/end_line để đọc từng đoạn (tối đa ~800 dòng/lần).',
    input_schema:{type:'object', properties:{ path:{type:'string'}, start_line:{type:'integer'}, end_line:{type:'integer'} }, required:['path']} },
  { name:'grep', description:'Tìm kiếm regex (không phân biệt hoa/thường) trong 1 file hoặc toàn repo (bỏ qua file nhị phân). Trả về dòng khớp kèm số dòng.',
    input_schema:{type:'object', properties:{ pattern:{type:'string'}, path:{type:'string'}, max_matches:{type:'integer'} }, required:['pattern']} },
  { name:'edit_file', description:'Thay CHÍNH XÁC 1 đoạn text duy nhất (old_str) bằng đoạn mới (new_str) trong 1 file. old_str phải khớp DUY NHẤT 1 lần, kể cả khoảng trắng/xuống dòng. LUÔN read_file trước khi edit để lấy đúng text hiện tại.',
    input_schema:{type:'object', properties:{ path:{type:'string'}, old_str:{type:'string'}, new_str:{type:'string'} }, required:['path','old_str','new_str']} },
  { name:'write_file', description:'Tạo file mới hoặc GHI ĐÈ TOÀN BỘ nội dung 1 file. Ưu tiên edit_file cho sửa nhỏ; chỉ dùng write_file cho file mới hoặc viết lại toàn bộ.',
    input_schema:{type:'object', properties:{ path:{type:'string'}, content:{type:'string'} }, required:['path','content']} },
  { name:'todo_write', description:'Ghi/cập nhật danh sách việc cần làm theo từng bước, để người dùng theo dõi tiến độ. Gọi mỗi khi kế hoạch thay đổi. Chỉ cần dùng cho việc nhiều bước.',
    input_schema:{type:'object', properties:{ todos:{type:'array', items:{type:'object', properties:{content:{type:'string'}, status:{type:'string', enum:['pending','in_progress','completed']}}, required:['content','status']}} }, required:['todos']} },
  { name:'web_fetch', description:'Tải và đọc nội dung text của 1 URL bên ngoài (vd để tra cứu thông tin y khoa, tham khảo cách trang khác trình bày...). Chỉ hoạt động với trang cho phép CORS từ trình duyệt.',
    input_schema:{type:'object', properties:{ url:{type:'string'} }, required:['url']} },
  { name:'task', description:'Giao 1 việc con cụ thể, khép kín cho 1 subagent độc lập chạy riêng (có đủ các tool trừ task) rồi CHỈ trả về bản tóm tắt kết quả. Dùng khi cần khám phá/đọc nhiều file để tìm hiểu 1 việc mà không muốn làm phình lịch sử hội thoại chính — vd "tìm tất cả chỗ định nghĩa màu sắc trong CSS và tóm tắt hệ màu đang dùng".',
    input_schema:{type:'object', properties:{ description:{type:'string', description:'mô tả ngắn việc giao'}, prompt:{type:'string', description:'chỉ dẫn đầy đủ cho subagent'} }, required:['description','prompt']} }
];

async function executeTool(name, input){
  try{
    switch(name){
      case 'list_files': return await toolListFiles();
      case 'read_file': return await toolReadFile(input);
      case 'grep': return await toolGrep(input);
      case 'edit_file': return await toolEditFile(input);
      case 'write_file': return await toolWriteFile(input);
      case 'todo_write': return await toolTodoWrite(input);
      case 'web_fetch': return await toolWebFetch(input);
      case 'task': return await toolTask(input);
      default: return 'LỖI: tool không tồn tại: ' + name;
    }
  }catch(e){ return 'LỖI khi chạy tool ' + name + ': ' + (e.message || String(e)); }
}

// ---------------- model call ----------------
async function callModel(messages, signal, opts){
  opts = opts || {};
  let system = opts.system || (
    'Bạn là 1 coding agent tự động, có quyền dùng tool để đọc/tìm/sửa file trong 1 repo GitHub thật (chủ đề: trang web y học). ' +
    'Quy trình bắt buộc: (1) list_files nếu chưa rõ cấu trúc, (2) read_file các phần liên quan TRƯỚC khi sửa, (3) với việc nhiều bước, gọi todo_write để lập kế hoạch và cập nhật trạng thái khi xong từng bước, (4) dùng edit_file cho sửa nhỏ/chính xác, write_file chỉ cho file mới hoặc viết lại toàn bộ, (5) SAU KHI sửa xong, có thể read_file lại đoạn vừa sửa để tự kiểm tra, (6) nếu có việc con cần khám phá sâu/tốn nhiều bước đọc file mà không muốn làm phình hội thoại chính, giao cho tool "task" (subagent). ' +
    'File có thể rất lớn (hàng MB) — chỉ đọc phần cần thiết bằng start_line/end_line, đừng cố đọc hết 1 file khổng lồ. ' +
    'KHÔNG tự push — mọi thay đổi chỉ nằm trong bộ nhớ tạm, người dùng sẽ tự bấm nút push sau khi xem lại. ' +
    'Khi đã hoàn tất toàn bộ yêu cầu, trả lời bằng 1 đoạn văn bản tóm tắt (không gọi thêm tool) để kết thúc lượt làm việc.'
  );
  if(!opts.system && state.claudeMd){
    system += '\n\n--- Hướng dẫn riêng của dự án (từ CLAUDE.md trong repo) ---\n' + state.claudeMd.slice(0, 4000);
  }
  const tools = opts.tools || TOOLS;
  let url, headers;
  if(settings.mode === 'fcc'){
    url = (settings.fccUrl||'http://localhost:8082').replace(/\/+$/,'') + '/v1/messages';
    headers = {'Content-Type':'application/json'};
    if(settings.fccToken) headers['Authorization'] = 'Bearer ' + settings.fccToken;
  } else {
    url = 'https://api.anthropic.com/v1/messages';
    headers = {'Content-Type':'application/json','x-api-key':settings.anthropicKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'};
  }
  const body = { model: settings.model || 'claude-sonnet-5', max_tokens: 4096, system, messages, tools };
  const r = await fetch(url, { method:'POST', headers, body: JSON.stringify(body), signal });
  if(!r.ok) throw new Error('Lỗi gọi model (' + r.status + '): ' + (await r.text()).slice(0,300));
  return r.json();
}

// ---------------- agent loop ----------------
async function runAgent(userText){
  await loadClaudeMd();
  state.messages.push({ role:'user', content: userText });
  const MAX_TURNS = 25;
  for(let turn=0; turn<MAX_TURNS; turn++){
    let data;
    try{
      data = await callModel(state.messages, aborter.signal);
    }catch(e){
      if(e.name === 'AbortError'){ log('Đã dừng theo yêu cầu.', 'l-info'); return; }
      log('Lỗi: ' + e.message, 'l-error'); return;
    }
    const content = data.content || [];
    const textParts = content.filter(b=>b.type==='text').map(b=>b.text).join('\n').trim();
    const toolCalls = content.filter(b=>b.type==='tool_use');

    if(textParts) log(textParts, 'l-ai');
    state.messages.push({ role:'assistant', content });

    if(!toolCalls.length){
      showPending();
      return; // done
    }

    const resultBlocks = [];
    for(const tc of toolCalls){
      log('🔧 ' + tc.name + '(' + JSON.stringify(tc.input).slice(0,160) + ')', 'l-tool');
      const result = await executeTool(tc.name, tc.input);
      log(String(result).slice(0,300), 'l-tool');
      resultBlocks.push({ type:'tool_result', tool_use_id: tc.id, content: String(result) });
    }
    state.messages.push({ role:'user', content: resultBlocks });

    if(data.stop_reason === 'end_turn' && !toolCalls.length) break;
  }
  log('Đã đạt giới hạn số bước (an toàn), dừng lại. Bạn có thể ra lệnh tiếp để agent làm tiếp.', 'l-info');
  showPending();
}

// ---------------- pending changes / push ----------------
function dirtyFiles(){
  const out = [];
  for(const [path, f] of state.files.entries()){
    if(f.isNew || f.current !== f.original) out.push({ path, ...f });
  }
  return out;
}
function showPending(){
  const dirty = dirtyFiles();
  const box = $('pending'), list = $('pendingList');
  if(!dirty.length){ box.classList.remove('show'); return; }
  list.innerHTML = dirty.map(f => '<div class="file"><span>' + escapeHtml(f.path) + '</span><span class="tag ' + (f.isNew?'new':'mod') + '">' + (f.isNew?'MỚI':'SỬA') + '</span></div>').join('');
  box.classList.add('show');
}
$('discardBtn').addEventListener('click', ()=>{
  for(const f of dirtyFiles()) state.files.get(f.path).current = state.files.get(f.path).original ?? '';
  for(const [path,f] of [...state.files.entries()]) if(f.isNew) state.files.delete(path);
  showPending();
  log('Đã huỷ toàn bộ thay đổi đang chờ.', 'l-info');
});
$('pushBtn').addEventListener('click', async ()=>{
  const dirty = dirtyFiles();
  if(!dirty.length) return;
  if(!settings.ghToken){ log('Cần nhập GitHub PAT trong Cấu hình để push.', 'l-error'); return; }
  $('pushBtn').disabled = true;
  try{
    log('Đang tạo blob cho ' + dirty.length + ' file...', 'l-info');
    const blobs = [];
    for(const f of dirty){
      const r = await fetch(ghApi('/git/blobs'), { method:'POST', headers:{...ghHeaders(),'Content-Type':'application/json'},
        body: JSON.stringify({ content: utf8ToB64(f.current), encoding:'base64' }) });
      if(!r.ok) throw new Error('Tạo blob lỗi cho ' + f.path + ': ' + (await r.text()).slice(0,200));
      const j = await r.json();
      blobs.push({ path: f.path, mode:'100644', type:'blob', sha: j.sha });
    }
    const ref = await ghGetJson('/git/ref/heads/' + settings.branch);
    const baseCommit = await ghGetJson('/git/commits/' + ref.object.sha);
    log('Đang tạo tree mới...', 'l-info');
    const treeRes = await fetch(ghApi('/git/trees'), { method:'POST', headers:{...ghHeaders(),'Content-Type':'application/json'},
      body: JSON.stringify({ base_tree: baseCommit.tree.sha, tree: blobs }) });
    if(!treeRes.ok) throw new Error('Tạo tree lỗi: ' + (await treeRes.text()).slice(0,200));
    const tree = await treeRes.json();
    log('Đang tạo commit...', 'l-info');
    const commitRes = await fetch(ghApi('/git/commits'), { method:'POST', headers:{...ghHeaders(),'Content-Type':'application/json'},
      body: JSON.stringify({ message: 'Agent update: ' + dirty.map(f=>f.path).join(', ').slice(0,200), tree: tree.sha, parents: [ref.object.sha] }) });
    if(!commitRes.ok) throw new Error('Tạo commit lỗi: ' + (await commitRes.text()).slice(0,200));
    const commit = await commitRes.json();
    const patchRes = await fetch(ghApi('/git/refs/heads/' + settings.branch), { method:'PATCH', headers:{...ghHeaders(),'Content-Type':'application/json'},
      body: JSON.stringify({ sha: commit.sha }) });
    if(!patchRes.ok) throw new Error('Cập nhật branch lỗi: ' + (await patchRes.text()).slice(0,200));
    for(const f of dirty){ const ff = state.files.get(f.path); ff.original = ff.current; ff.isNew = false; ff.sha = null; }
    state.tree = null; // buộc load lại tree ở lần dùng tool tiếp theo
    showPending();
    log('✅ Đã push thành công lên nhánh "' + settings.branch + '". Commit: ' + commit.sha.slice(0,7), 'l-success');
  }catch(e){
    log('Lỗi khi push: ' + e.message, 'l-error');
  }finally{
    $('pushBtn').disabled = false;
  }
});

// ---------------- form ----------------
const form = $('cmdForm'), input = $('cmdInput'), sendBtn = $('sendBtn'), stopBtn = $('stopBtn');
input.addEventListener('input', ()=>{ input.style.height='auto'; input.style.height=Math.min(input.scrollHeight,160)+'px'; });
input.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); form.requestSubmit(); } });
form.addEventListener('submit', async e=>{
  e.preventDefault();
  const text = input.value.trim();
  if(!text) return;
  if(!settings.owner || !settings.repo){ log('Hãy cấu hình owner/repo GitHub trước.', 'l-error'); $('settings').classList.add('show'); return; }
  if(settings.mode==='api' && !settings.anthropicKey){ log('Hãy nhập Anthropic API key trong Cấu hình.', 'l-error'); return; }
  log(text, 'l-user');
  input.value=''; input.style.height='auto';
  sendBtn.disabled = true; stopBtn.disabled = false;
  aborter = new AbortController();
  try{ await runAgent(text); } finally { sendBtn.disabled = false; stopBtn.disabled = true; }
});
stopBtn.addEventListener('click', ()=>{ if(aborter) aborter.abort(); });

log('Sẵn sàng. Tool: list_files / read_file / grep / edit_file / write_file / todo_write / web_fetch / task (subagent) trên repo "' + (settings.owner||'?') + '/' + (settings.repo||'?') + '". Nếu repo có file CLAUDE.md, agent sẽ tự đọc làm hướng dẫn riêng. Thay đổi chỉ được push sau khi bạn xác nhận.', 'l-info');
</script>
